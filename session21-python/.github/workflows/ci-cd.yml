name: DevOps HeroBoard CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Automated Unit & Integration Tests (Pytest + React Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest test suite
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React frontend
        run: npm install && npm run build
        working-directory: frontend

  build-scan-push:
    name: Container Build, Trivy Security Scan & GHCR Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }} ./frontend

      - name: Trivy vulnerability scan (Backend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy vulnerability scan (Frontend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }}

  deploy:
    name: Helm Continuous Deployment
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          else
            echo "Skipping cluster deploy: KUBE_CONFIG_DATA secret not configured yet."
          fi

      - name: Deploy with Helm
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/heroboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/heroboard-frontend
