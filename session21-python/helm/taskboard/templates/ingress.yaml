{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: "{{ include "taskboard.fullname" . }}-backend", port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: "{{ include "taskboard.fullname" . }}-frontend", port: {number: 80}}
{{- end }}
