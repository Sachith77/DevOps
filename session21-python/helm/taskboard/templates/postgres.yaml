apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
spec:
  selector: {app: "{{ include "taskboard.fullname" . }}-postgres"}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: "{{ include "taskboard.fullname" . }}-postgres"}
  template:
    metadata:
      labels: {app: "{{ include "taskboard.fullname" . }}-postgres"}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: "{{ .Values.postgres.database }}"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: "{{ .Values.postgres.existingSecret }}", key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: "{{ .Values.postgres.existingSecret }}", key: password}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "taskboard.fullname" . }}-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgres.storageClassName }}
  storageClassName: {{ .Values.postgres.storageClassName | quote }}
  {{- end }}
  resources:
    requests: {storage: "{{ .Values.postgres.storageSize }}"}
