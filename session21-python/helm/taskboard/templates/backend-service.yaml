apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels: {app: "{{ include "taskboard.fullname" . }}-backend"}
spec:
  type: ClusterIP
  selector: {app: "{{ include "taskboard.fullname" . }}-backend"}
  ports:
    - {port: 8000, targetPort: 8000, name: http}
