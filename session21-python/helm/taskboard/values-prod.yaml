replicaCount: 2
postgres:
  storageClassName: gp3
ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
hpa:
  enabled: true
monitoring:
  serviceMonitor:
    enabled: true
