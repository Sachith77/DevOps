name: Session 21 DevOps HeroBoard CI/CD
on:
  push:
    paths:
      - 'session21-python/**'
      - '.github/workflows/session21-ci-cd.yml'
    branches: [main, sync-to-devops]
  pull_request:
    paths:
      - 'session21-python/**'
    branches: [main, sync-to-devops]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Automated Tests (Pytest + Frontend Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: session21-python/backend

      - name: Run Pytest test suite
        run: pytest -v
        working-directory: session21-python/backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React frontend
        run: npm install && npm run build
        working-directory: session21-python/frontend

  build-scan-push:
    name: Container Build & Trivy Security Scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }} ./session21-python/backend
          docker build -t ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }} ./session21-python/frontend

      - name: Trivy vulnerability scan (Backend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy vulnerability scan (Frontend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/heroboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/heroboard-frontend:${{ github.sha }}
